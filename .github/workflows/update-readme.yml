
name: Update Project Archive README

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project list
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"

          if start not in content or end not in content:
              raise SystemExit("Missing project markers in README.md")

          ignored = {
              ".git", ".github", "node_modules",
              "__pycache__", ".vscode"
          }

          projects = []

          for folder in sorted(
              Path(".").rglob("*"),
              key=lambda p: p.as_posix().lower()
          ):
              if not folder.is_dir():
                  continue

              if any(part in ignored for part in folder.parts):
                  continue

              if not (folder / "README.md").is_file():
                  continue

              if folder == Path("."):
                  continue

              title = folder.name.replace("-", " ").replace("_", " ").title()
              description = ""

              lines = (folder / "README.md").read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines()

              for line in lines:
                  line = line.strip()
                  if line and not line.startswith("#"):
                      description = re.sub(r"\s+", " ", line)
                      break

              entry = f"- **[{title}](./{folder.as_posix()}/)**"
              if description:
                  entry += f" - {description}"

              projects.append(entry)

          listing = "\n".join(projects) or "_No projects found yet._"

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)

          readme.write_text(
              f"{before}{start}\n{listing}\n{end}{after}",
              encoding="utf-8"
          )
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update project archive README"
            git push
          fi
