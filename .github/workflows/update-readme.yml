
name: Update Project Archive README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project list
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          readme = root / "README.md"
          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"

          content = readme.read_text(encoding="utf-8")

          projects = []
          excluded = {
              ".github", ".git", "node_modules",
              ".vscode", "__pycache__"
          }

          for folder in sorted(root.iterdir(), key=lambda p: p.name.lower()):
              if not folder.is_dir() or folder.name in excluded:
                  continue

              if not any(folder.iterdir()):
                  continue

              title = folder.name.replace("-", " ").replace("_", " ")
              title = title.title()
              description = ""

              for filename in ("README.md", "readme.md"):
                  project_readme = folder / filename
                  if project_readme.is_file():
                      lines = project_readme.read_text(
                          encoding="utf-8", errors="replace"
                      ).splitlines()
                      for line in lines:
                          line = line.strip()
                          if line and not line.startswith("#"):
                              description = line
                              break
                      break

              link = f"./{folder.name}/"
              entry = f"- **[{title}]({link})**"
              if description:
                  description = re.sub(r"\s+", " ", description)
                  entry += f" - {description}"
              projects.append(entry)

          listing = "\n".join(projects) or "_No project folders found yet._"

          if start not in content or end not in content:
              raise SystemExit(
                  "README.md must contain the project markers."
              )

          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)

          updated = f"{before}{start}\n{listing}\n{end}{after}"
          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update project archive README"
            git push
          fi
